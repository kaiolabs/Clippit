# Clippit — history settings (daemon and popup).
# The daemon creates ~/.config/clippit/config.toml on first run; this file shows every option.
# Most of it is easier to change in the settings app (Geral). AI, shortcuts and the spell checker
# are configured in ~/.config/clippit/corretor.conf — see docs/configuration.md.

[general]
max_history_items = 100        # items kept; older ones are removed
poll_interval_ms = 200         # how often the clipboard is checked
max_text_size = 10485760       # bytes; larger texts are not saved

[hotkeys]
show_history_modifier = "alt"  # Alt+C opens the history
show_history_key = "c"

[ui]
language = "pt"                # "pt" or "en" (settings app and popup)
show_notifications = true      # popup only

[privacy]
enable_image_capture = true    # save copied images and screenshots
max_image_size_mb = 10

[features]
enable_ocr = true              # read the text in images so it can be searched

[ocr]
languages = "por+eng"          # Tesseract languages
