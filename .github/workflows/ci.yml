name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libtesseract-dev libleptonica-dev \
            libclang-dev clang libx11-dev libxcb1-dev libxdo-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace --release

  scripts:
    name: Scripts and GNOME extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Python syntax
        run: |
          for f in scripts/clippit-correct scripts/clippit-busca scripts/clippit-doutor scripts/clippit-jogos-nvidia scripts/*.py; do
            python3 -m py_compile "$f"
          done

      - name: Shell syntax
        run: |
          for f in scripts/*.sh scripts/clippit-historico; do bash -n "$f"; done

      - name: Extension syntax
        run: |
          # GJS uses ES modules with gi:// imports; node only checks the syntax.
          for f in gnome-extension/clippit-corretor@clippit/*.js; do
            cp "$f" "/tmp/$(basename "$f" .js).mjs"
            node --check "/tmp/$(basename "$f" .js).mjs"
          done

      - name: Extension metadata
        run: python3 -c "import json; json.load(open('gnome-extension/clippit-corretor@clippit/metadata.json'))"
